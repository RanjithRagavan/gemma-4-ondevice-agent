# Per-task evaluation budget tuned for ~120 test tasks within the 12-hour total limit.
# Gives 4x more time and 2.5x more tool calls than sample_submission while staying safely
# inside the 12-hour total wall-clock budget.
evaluation:
  timeout_seconds: 90
  max_tool_calls: 25
  max_time_minutes: 4
  max_turns: 50
