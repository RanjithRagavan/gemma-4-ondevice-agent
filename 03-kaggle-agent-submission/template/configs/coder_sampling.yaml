# Generation config for the root coder agent.
# Note: Omit thinking_level when serving via vLLM OpenAI-compatible /v1 endpoint.
# Setting thinking_budget > 0 with include_thoughts: false enables deep reasoning on
# every turn while stripping verbose thought blocks from outgoing history so the 32K
# context window stays crisp and avoids premature compaction (threshold: 14,336 tokens).
temperature: 0.15
top_p: 0.95
max_output_tokens: 16384
thinking_config:
  thinking_budget: 3072
  include_thoughts: false
